<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="wrapper container">
        <div class="header">
            <div class="logo-header">
                <img src="./svg/logo.svg" alt="">
                <div>
                    <h1>NEXT PIZZA</h1>
                    <p>вкусней уже некуда</p>
                </div>
            </div>
            <div class="header_search">
                <img src="./svg/gless.svg" alt="">
                <input type="text" placeholder="Поиск пиццы...">
            </div>

            <div class="header_btn">
                <button class="btn_user">
                    <img src="./svg/user.svg" alt="">
                    Войти
                </button>
                <button class="btn_shop">
                    <img src="./svg/shop.svg" alt="">
                </button>
            </div>
        </div>
        <hr class="header_hr">
    </header>
    <section class="section_1">
        <h1>Все пиццы</h1>
        <div class="choice">
            <div class="choice_title">
                <a href="">Все</a>
                <a href="">Мясные</a>
                <a href="">Острые</a>
                <a href="">Сладкие</a>
                <a href="">Вегетарианские</a>
                <a href="">С курицей</a>
                <select name="" id="">
                    <option value="">Ещё </option>
                </select>
            </div>
            <div class="sorting">
                <img src="./svg/vector.svg" alt="">
                <h4>Сортировка:</h4>
                <a href="">рейтингу</a>
            </div>
        </div>
    </section>
    <div>
        <div class="checkbox_text">
            <img src="./svg/check.svg" alt="">
            <h3>Можно собирать</h3>
        </div>
        <div class="checkbox_text">
            <img src="./svg/check2.svg" alt="">
            <h3>Новинки</h3>
        </div>
    </div>

</body>

</html>
